{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link enviado — Wisecofre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 50%, #253547 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 p-md-5 text-center">
            <div class="bg-success bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                <i class="bi bi-envelope-check-fill fs-2"></i>
            </div>
            <h4 class="fw-bold">Verifique seu e-mail</h4>
            <p class="text-muted small">
                Se o e-mail informado estiver cadastrado, enviamos um link para redefinir sua senha.
                O link expira em alguns dias. Confira também a caixa de spam.
            </p>
            <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 mt-2">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao login
            </a>
        </div>
    </div>
    <p class="text-center text-white-50 small mt-3">&copy; {{ year|default:"2026" }} Wisecofre</p>
</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — Wisecofre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 50%, #253547 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                    <i class="bi bi-key-fill fs-2"></i>
                </div>
                <h4 class="fw-bold">Redefinir senha</h4>
                <p class="text-muted small mb-0">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold small">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" id="email" class="form-control" placeholder="seu@email.com" required autofocus>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                    <i class="bi bi-send me-1"></i> Enviar link
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i>Voltar ao login
                </a>
            </div>
        </div>
    </div>
    <p class="text-center text-white-50 small mt-3">&copy; {{ year|default:"2026" }} Wisecofre</p>
</div>

</body>
</html>
